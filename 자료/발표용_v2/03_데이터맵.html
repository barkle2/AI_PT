<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>슬라이드 03 — 고용노동부 데이터맵 | 고용노동부 AX 추진 현황</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #f8fafc;
      font-family: 'Pretendard', 'Malgun Gothic', '맑은 고딕', -apple-system, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .slide-wrap {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 48%, #e2e8f0 100%);
      color: #0f172a;
      position: relative;
      overflow: hidden;
      --u: calc(min(100vw, calc(100vh * 16 / 9)) / 1920);
    }

    .slide::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: calc(8 * var(--u));
      background: linear-gradient(180deg, #38bdf8 0%, #2563eb 50%, #38bdf8 100%);
      box-shadow: 0 0 calc(20 * var(--u)) rgba(37, 99, 235, 0.18);
    }

    .slide::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(15, 23, 42, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15, 23, 42, 0.025) 1px, transparent 1px);
      background-size: calc(80 * var(--u)) calc(80 * var(--u));
      pointer-events: none;
    }

    .slide-top {
      position: absolute;
      top: calc(70 * var(--u));
      left: calc(90 * var(--u));
      right: calc(90 * var(--u));
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: calc(18 * var(--u));
    }

    .brand-mark {
      width: calc(64 * var(--u));
      height: calc(64 * var(--u));
      background: url('../고용노동부.png') center/contain no-repeat;
      flex-shrink: 0;
    }

    .brand-text {
      line-height: 1.15;
    }

    .brand-text .ko {
      font-size: calc(26 * var(--u));
      font-weight: 700;
      color: #0f172a;
      letter-spacing: 0.01em;
    }

    .brand-text .en {
      font-size: calc(12 * var(--u));
      font-weight: 500;
      color: #475569;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-top: calc(2 * var(--u));
    }

    .venue {
      text-align: right;
      line-height: 1.4;
    }

    .venue-text {
      font-size: calc(20 * var(--u));
      color: #0f172a;
      font-weight: 500;
    }

    .slide-body {
      position: absolute;
      left: calc(120 * var(--u));
      right: calc(90 * var(--u));
      top: calc(190 * var(--u));
      bottom: calc(140 * var(--u));
      z-index: 2;
      display: flex;
      flex-direction: column;
    }

    .eyebrow {
      font-size: calc(22 * var(--u));
      font-weight: 600;
      letter-spacing: 0.18em;
      color: #0f4c81;
    }

    .rule {
      width: calc(96 * var(--u));
      height: calc(4 * var(--u));
      background: linear-gradient(90deg, #0ea5e9 0%, #2563eb 100%);
      margin: calc(28 * var(--u)) 0 calc(28 * var(--u));
      border-radius: calc(2 * var(--u));
    }

    .main-title {
      font-size: calc(50 * var(--u));
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: calc(24 * var(--u));
    }

    .subtitle {
      font-size: calc(20 * var(--u));
      font-weight: 500;
      color: #334155;
      letter-spacing: 0.01em;
      line-height: 1.4;
      margin-bottom: calc(20 * var(--u));
    }

    .subtitle .sep {
      color: #2563eb;
      font-weight: 600;
      padding: 0 calc(6 * var(--u));
    }

    .body-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 35fr 65fr;
      gap: calc(36 * var(--u));
      min-height: 0;
    }

    .left-pane {
      display: flex;
      flex-direction: column;
      gap: calc(28 * var(--u));
      min-height: 0;
    }

    .indicator-stack {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: calc(12 * var(--u));
      position: relative;
    }

    .indicator-stack::before {
      content: '';
      position: absolute;
      left: calc(2 * var(--u));
      top: calc(16 * var(--u));
      bottom: calc(16 * var(--u));
      width: calc(1 * var(--u));
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.28) 0%, rgba(14, 165, 233, 0.24) 50%, rgba(96, 165, 250, 0.18) 100%);
      pointer-events: none;
    }

    .level {
      display: flex;
      align-items: center;
      gap: calc(22 * var(--u));
      padding: calc(8 * var(--u)) 0 calc(8 * var(--u)) calc(28 * var(--u));
      position: relative;
    }

    .level.l1 { padding-left: calc(20 * var(--u)); }
    .level.l2 { padding-left: calc(36 * var(--u)); }
    .level.l3 { padding-left: calc(52 * var(--u)); }
    .level.l4 { padding-left: calc(68 * var(--u)); }

    .level::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: calc(8 * var(--u));
      height: calc(8 * var(--u));
      border-radius: 50%;
      background: #2563eb;
      box-shadow: 0 0 calc(10 * var(--u)) rgba(37, 99, 235, 0.35);
    }

    .level.l1::before { left: calc(0 * var(--u)); background: #0ea5e9; }
    .level.l2::before { left: calc(16 * var(--u)); background: #2563eb; }
    .level.l3::before { left: calc(32 * var(--u)); background: #3b82f6; }
    .level.l4::before { left: calc(48 * var(--u)); background: #60a5fa; }

    .level .num {
      font-size: calc(64 * var(--u));
      font-weight: 900;
      color: #0f4c81;
      letter-spacing: -0.04em;
      line-height: 0.95;
      min-width: calc(120 * var(--u));
    }

    .level .label {
      display: flex;
      flex-direction: column;
      gap: calc(4 * var(--u));
    }

    .level .label .ko {
      font-size: calc(22 * var(--u));
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .level .label .en {
      font-size: calc(12 * var(--u));
      font-weight: 500;
      color: #64748b;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .metadata-section {
      display: flex;
      flex-direction: column;
      gap: calc(14 * var(--u));
    }

    .meta-eyebrow {
      font-size: calc(18 * var(--u));
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #0f4c81;
    }

    .meta-rule {
      width: calc(32 * var(--u));
      height: calc(3 * var(--u));
      background: linear-gradient(90deg, #0ea5e9 0%, #2563eb 100%);
      border-radius: calc(1 * var(--u));
    }

    .meta-chips {
      display: flex;
      flex-wrap: wrap;
      gap: calc(9 * var(--u));
      margin-top: calc(2 * var(--u));
    }

    .meta-chip {
      display: inline-flex;
      align-items: center;
      padding: calc(8 * var(--u)) calc(16 * var(--u));
      background: rgba(14, 165, 233, 0.06);
      border: 1px solid rgba(37, 99, 235, 0.15);
      border-radius: calc(999 * var(--u));
      font-size: calc(17 * var(--u));
      font-weight: 500;
      color: #334155;
      letter-spacing: 0.01em;
      line-height: 1.2;
      white-space: nowrap;
    }

    .tree-pane {
      position: relative;
      border: 1px solid rgba(37, 99, 235, 0.18);
      border-radius: calc(8 * var(--u));
      background: #ffffff;
      overflow: hidden;
      box-shadow: inset 0 0 calc(40 * var(--u)) rgba(37, 99, 235, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(14 * var(--u));
    }

    .tree-pane img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: transparent;
      filter: none;
    }

    .slide-foot {
      position: absolute;
      left: calc(120 * var(--u));
      bottom: calc(60 * var(--u));
      z-index: 2;
      font-size: calc(13 * var(--u));
      font-weight: 500;
      letter-spacing: 0.22em;
      color: #475569;
    }

    .slide-foot .cur {
      color: #0f172a;
    }
  </style>
</head>

<body>
  <div class="slide-wrap">
    <div class="slide">
      <header class="slide-top">
        <div class="brand">
          <div class="brand-mark"></div>
          <div class="brand-text">
            <div class="ko">고용노동부</div>
            <div class="en">Ministry of Employment and Labor</div>
          </div>
        </div>
        <div class="venue">
          <span class="venue-text">제3차 양성평등위원회</span>
        </div>
      </header>

      <main class="slide-body">
        <div class="eyebrow">02. AX 추진 준비 상황</div>
        <div class="rule"></div>
        <h1 class="main-title">고용노동부 데이터맵</h1>
        <div class="subtitle">
          고용노동부 + 12개 산하기관 + 유관기관 통합 데이터 현황
        </div>

        <div class="body-grid">
          <div class="left-pane">
            <div class="indicator-stack">
              <div class="level l1">
                <div class="num">5</div>
                <div class="label">
                  <div class="ko">대분류</div>
                  <div class="en">Category</div>
                </div>
              </div>
              <div class="level l2">
                <div class="num">22</div>
                <div class="label">
                  <div class="ko">중분류</div>
                  <div class="en">Subcategory</div>
                </div>
              </div>
              <div class="level l3">
                <div class="num">90</div>
                <div class="label">
                  <div class="ko">소분류</div>
                  <div class="en">Class</div>
                </div>
              </div>
              <div class="level l4">
                <div class="num">246</div>
                <div class="label">
                  <div class="ko">기준단위</div>
                  <div class="en">Data Unit</div>
                </div>
              </div>
            </div>

            <div class="metadata-section">
              <div class="meta-eyebrow">데이터맵은 메타데이터 표준과 매칭</div>
              <div class="meta-rule"></div>
              <div class="meta-chips">
                <span class="meta-chip">정보시스템명</span>
                <span class="meta-chip">한·영 DB명</span>
                <span class="meta-chip">DBMS 종류·버전</span>
                <span class="meta-chip">테이블명</span>
                <span class="meta-chip">레코드 수</span>
                <span class="meta-chip">컬럼명</span>
                <span class="meta-chip">데이터타입</span>
                <span class="meta-chip">NOT NULL</span>
                <span class="meta-chip">PK·FK</span>
              </div>
            </div>
          </div>

          <div class="tree-pane">
            <img src="./데이터맵.png" alt="고용노동부 데이터맵 구조" />
          </div>
        </div>
      </main>

      <footer class="slide-foot">
        <span class="cur">03</span> &nbsp;/&nbsp; 11
      </footer>
    </div>
  </div>
</body>

</html>
